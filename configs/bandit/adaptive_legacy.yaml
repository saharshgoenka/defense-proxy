# Legacy adaptive bandit config: restore the previous "always inject"
# cadence by disabling the new anti-detection gating in http_proxy.py.
#
# Note: fake_flag text rotation lives in payloads.py (code-level). This
# config only reverts the injection timing/cadence behavior.

mode: bandit

target:
  host: localhost
  http_port: 3000

proxy:
  http_port: 8080

logging:
  log_dir: ./logs

defenses: []   # ignored in bandit mode; arms come from priors.yaml

bandit:
  priors_path: configs/bandit/priors.yaml
  window_requests: 5
  window_seconds: 30.0
  seed: 42

  # Disable cadence gating (inject as often as possible).
  warmup_requests: 0
  inject_every_nth: 1
  inject_prob_recon: 1.0
  inject_prob_enum: 1.0
  inject_prob_exploit: 1.0
  inject_prob_exfil: 1.0

