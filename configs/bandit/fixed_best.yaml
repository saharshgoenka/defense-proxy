# Static "fixed-best" defense: always inject the marginal-best arm
# (fake_flag in HTTP body, context_blend trigger) on every applicable
# response. The strongest static baseline from prior ablation.

mode: static

target:
  host: localhost
  http_port: 3000

proxy:
  http_port: 8080

logging:
  log_dir: ./logs

defenses:
  - enabled: true
    position: http_body
    trigger: context_blend
    payload: fake_flag
    stealth: inline
